<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RaYzZzLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #101010;
    --border: #262626;
    --border-soft: #1c1c1c;
    --text-hi: #f2f2ef;
    --text-mid: #9a9a97;
    --text-dim: #565654;
    --white: #ffffff;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text-hi); font-family: var(--sans);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, #1e1e1c 1px, transparent 1px); background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, #000 10%, transparent 75%);
  }
  .stage { width: 100%; max-width: 500px; position: relative; z-index: 1; }
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px 14px 4px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); letter-spacing: .08em;
  }
  .id { display: flex; align-items: center; gap: 8px; color: var(--text-mid); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--white); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,.35); }
    70% { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .panel-header { padding: 24px; border-bottom: 1px solid var(--border-soft); background: linear-gradient(180deg, #171717 0%, #141414 100%); text-align: center; }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .content { padding: 32px 24px; text-align: center; }
  .badge { width: 52px; height: 52px; border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; background: var(--panel-2); }
  .badge svg { width: 22px; height: 22px; }
  .status-text { font-size: 14px; color: var(--text-mid); line-height: 1.6; margin-bottom: 28px; }

  .btn { font-family: var(--sans); font-size: 14px; font-weight: 600; padding: 12px 18px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: background .12s ease, border-color .12s ease; width: 100%; }
  .btn-primary { background: var(--white); color: #0a0a0a; }
  .btn-primary:hover { background: #e4e4e1; }
  .btn svg { width: 15px; height: 15px; }

  footer { text-align: center; padding-top: 18px; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
</style>
</head>
<body>

<div class="stage">
  <div class="statusbar">
    <div class="id"><span class="dot"></span><span>RAYZZZLAB · HOME</span></div>
    <div id="clock">--:--:--</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="eyebrow">Development Lab</div>
      <h1>RaYzZzLab</h1>
    </div>

    <div class="content">

      <p class="status-text">Check out my profile on the Kodular Community.</p>

      <a class="btn btn-primary" href="https://community.kodular.io/u/rayzzz/summary" target="_blank" rel="noopener noreferrer">
        Kodular Community
        <svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </div>
  </div>
  <footer>Secure Local Sandbox · No External Tracking</footer>
</div>

<script>
  const updateClock = () => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', {hour12:false}); };
  updateClock(); setInterval(updateClock, 1000);
</script>

</body>
</html>
